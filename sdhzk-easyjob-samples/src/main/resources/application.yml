easyjob:
  enabled: true
  preferred-networks: 192.168.31
  thread-pool:
    core-pool-size: 8
    max-pool-size: 8
    keep-alive-seconds: 0
  cluster:
    enabled: true
    name: mycloud
    app-id: myapp
  zk:
    connectionString: ${zk.connectionString}
    baseSleepTimeMs: 1000
    maxRetries: 3



